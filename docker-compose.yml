# OneBD - Pharmaceutical BD Intelligence Platform
# Combines Cortellis deals database with Edgar BD SEC filings
# Uses Neo4j as graph integration layer

name: onebd

services:
  # ============================================
  # DATABASES
  # ============================================

  # Cortellis PostgreSQL (deals database)
  onebd-db-cortellis:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    environment:
      POSTGRES_DB: ${CORTELLIS_DB:-cortellis}
      POSTGRES_USER: ${CORTELLIS_USER:-cortellis}
      POSTGRES_PASSWORD: ${CORTELLIS_PASSWORD:-changeme}
    volumes:
      - onebd_cortellis_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORTELLIS_USER:-cortellis} -d ${CORTELLIS_DB:-cortellis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    restart: unless-stopped

  # Edgar Source PostgreSQL (SEC filings with embedded chunks)
  onebd-db-edgar:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    environment:
      POSTGRES_DB: deals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - onebd_edgar_data:/var/lib/postgresql/data
    shm_size: '2gb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network
    restart: unless-stopped

  # Neo4j Graph Database (integration layer for relationship queries)
  onebd-neo4j:
    image: neo4j:5.15-community@sha256:d9e2fb1ba398536e50d22ebc3d5d585baa086c1c0cf8e5b96bdc9e11e87e002a
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-bdplatform123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - onebd_neo4j_data:/data
      - onebd_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-bdplatform123} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    restart: unless-stopped

  # Redis (caching + Celery broker)
  onebd-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    volumes:
      - onebd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dokploy-network
    restart: unless-stopped

  # ============================================
  # API SERVICES
  # ============================================

  # Unified API (FastAPI - routes to appropriate backend)
  onebd-api:
    build:
      context: .
      dockerfile: unified_api/Dockerfile
    depends_on:
      onebd-db-cortellis:
        condition: service_healthy
      onebd-db-edgar:
        condition: service_healthy
      onebd-neo4j:
        condition: service_healthy
      onebd-redis:
        condition: service_healthy
    environment:
      # Cortellis DB connection (deals, companies, contracts)
      - CORTELLIS_DB_URL=postgresql://${CORTELLIS_USER:-cortellis}:${CORTELLIS_PASSWORD:-changeme}@onebd-db-cortellis:5432/${CORTELLIS_DB:-cortellis}
      # Edgar Source DB connection (SEC filings, 3.3M chunks with embeddings)
      - EDGAR_SOURCE_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      # Legacy alias for compatibility
      - EDGAR_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      # Neo4j connection
      - NEO4J_URI=bolt://onebd-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-bdplatform123}
      # Redis connection
      - REDIS_URL=redis://onebd-redis:6379/0
      # API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EDGAR_FRESHNESS_WARN_HOURS=${EDGAR_FRESHNESS_WARN_HOURS:-48}
      - EDGAR_FRESHNESS_CRITICAL_HOURS=${EDGAR_FRESHNESS_CRITICAL_HOURS:-96}
      - EDGAR_FULLTEXT_CANDIDATE_LIMIT=${EDGAR_FULLTEXT_CANDIDATE_LIMIT:-500}
      - CORTELLIS_FRESHNESS_WARN_HOURS=${CORTELLIS_FRESHNESS_WARN_HOURS:-36}
      - CORTELLIS_FRESHNESS_CRITICAL_HOURS=${CORTELLIS_FRESHNESS_CRITICAL_HOURS:-72}
      - GRAPH_FRESHNESS_WARN_HOURS=${GRAPH_FRESHNESS_WARN_HOURS:-36}
      - GRAPH_FRESHNESS_CRITICAL_HOURS=${GRAPH_FRESHNESS_CRITICAL_HOURS:-72}
      - SOURCE_HEALTH_WEBHOOK_URL=${SOURCE_HEALTH_WEBHOOK_URL:-}
      - SOURCE_HEALTH_ALERT_EMAIL=${SOURCE_HEALTH_ALERT_EMAIL:-}
      # Cortellis API (for sync)
      - CORTELLIS_API_USERNAME=${CORTELLIS_API_USERNAME}
      - CORTELLIS_API_PASSWORD=${CORTELLIS_API_PASSWORD}
      - CORTELLIS_BASE_URL=${CORTELLIS_BASE_URL:-https://api.cortellis.com/api-ws/ws/rs}
      # Celery
      - BROKER_URL=redis://onebd-redis:6379/0
      - RESULT_BACKEND=redis://onebd-redis:6379/1
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - onebd_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    restart: unless-stopped

  # ============================================
  # BACKGROUND WORKERS
  # ============================================

  # Single worker for rate-limited tasks (SEC EDGAR crawling)
  onebd-crawl-worker:
    build:
      context: .
      dockerfile: unified_api/Dockerfile
    depends_on:
      onebd-db-cortellis:
        condition: service_healthy
      onebd-db-edgar:
        condition: service_healthy
      onebd-neo4j:
        condition: service_healthy
      onebd-redis:
        condition: service_healthy
    environment:
      - CORTELLIS_DB_URL=postgresql://${CORTELLIS_USER:-cortellis}:${CORTELLIS_PASSWORD:-changeme}@onebd-db-cortellis:5432/${CORTELLIS_DB:-cortellis}
      - EDGAR_SOURCE_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - EDGAR_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT:-OneBD onebd.pchomelab.com admin@pchomelab.com}
      - EDGAR_STORAGE_DIR=/app/storage
      - EDGAR_SYNC_BATCH_DAYS=${EDGAR_SYNC_BATCH_DAYS:-7}
      - EDGAR_SYNC_OVERLAP_DAYS=${EDGAR_SYNC_OVERLAP_DAYS:-3}
      - EDGAR_SYNC_MAX_FILINGS=${EDGAR_SYNC_MAX_FILINGS:-250}
      - EDGAR_RECENT_DAYS=${EDGAR_RECENT_DAYS:-3}
      - EDGAR_RECENT_MAX_FILINGS=${EDGAR_RECENT_MAX_FILINGS:-250}
      - EDGAR_SYNC_EMBED=${EDGAR_SYNC_EMBED:-true}
      - NEO4J_URI=bolt://onebd-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-bdplatform123}
      - REDIS_URL=redis://onebd-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - BROKER_URL=redis://onebd-redis:6379/0
      - RESULT_BACKEND=redis://onebd-redis:6379/1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GRAPH_FRESHNESS_WARN_HOURS=${GRAPH_FRESHNESS_WARN_HOURS:-36}
      - GRAPH_FRESHNESS_CRITICAL_HOURS=${GRAPH_FRESHNESS_CRITICAL_HOURS:-72}
      - SOURCE_HEALTH_WEBHOOK_URL=${SOURCE_HEALTH_WEBHOOK_URL:-}
      - SOURCE_HEALTH_ALERT_EMAIL=${SOURCE_HEALTH_ALERT_EMAIL:-}
      # Cortellis API credentials
      - CORTELLIS_API_USERNAME=${CORTELLIS_API_USERNAME}
      - CORTELLIS_API_PASSWORD=${CORTELLIS_API_PASSWORD}
      - CORTELLIS_BASE_URL=${CORTELLIS_BASE_URL:-https://api.cortellis.com/api-ws/ws/rs}
      - CORTELLIS_SYNC_OVERLAP_DAYS=${CORTELLIS_SYNC_OVERLAP_DAYS:-2}
      - CORTELLIS_CATALOG_SCAN_WORKERS=${CORTELLIS_CATALOG_SCAN_WORKERS:-8}
    volumes:
      - ./data:/app/data
      - onebd_storage:/app/storage
    command: ["celery", "-A", "unified_api.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "edgar"]
    networks:
      - dokploy-network
    restart: unless-stopped

  # Multiple workers for processing tasks (parsing, chunking, embedding, extraction)
  onebd-process-worker:
    build:
      context: .
      dockerfile: unified_api/Dockerfile
    depends_on:
      onebd-db-cortellis:
        condition: service_healthy
      onebd-db-edgar:
        condition: service_healthy
      onebd-neo4j:
        condition: service_healthy
      onebd-redis:
        condition: service_healthy
    environment:
      - CORTELLIS_DB_URL=postgresql://${CORTELLIS_USER:-cortellis}:${CORTELLIS_PASSWORD:-changeme}@onebd-db-cortellis:5432/${CORTELLIS_DB:-cortellis}
      - EDGAR_SOURCE_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - EDGAR_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - NEO4J_URI=bolt://onebd-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-bdplatform123}
      - REDIS_URL=redis://onebd-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - BROKER_URL=redis://onebd-redis:6379/0
      - RESULT_BACKEND=redis://onebd-redis:6379/1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GRAPH_FRESHNESS_WARN_HOURS=${GRAPH_FRESHNESS_WARN_HOURS:-36}
      - GRAPH_FRESHNESS_CRITICAL_HOURS=${GRAPH_FRESHNESS_CRITICAL_HOURS:-72}
      - SOURCE_HEALTH_WEBHOOK_URL=${SOURCE_HEALTH_WEBHOOK_URL:-}
      - SOURCE_HEALTH_ALERT_EMAIL=${SOURCE_HEALTH_ALERT_EMAIL:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - DIGEST_FROM_EMAIL=${DIGEST_FROM_EMAIL:-bd-intelligence@pchomelab.com}
      # Cortellis API credentials
      - CORTELLIS_API_USERNAME=${CORTELLIS_API_USERNAME}
      - CORTELLIS_API_PASSWORD=${CORTELLIS_API_PASSWORD}
      - CORTELLIS_BASE_URL=${CORTELLIS_BASE_URL:-https://api.cortellis.com/api-ws/ws/rs}
      - CORTELLIS_SYNC_OVERLAP_DAYS=${CORTELLIS_SYNC_OVERLAP_DAYS:-2}
      - CORTELLIS_CATALOG_SCAN_WORKERS=${CORTELLIS_CATALOG_SCAN_WORKERS:-8}
      - CORTELLIS_CATALOG_REPAIR_LIMIT=${CORTELLIS_CATALOG_REPAIR_LIMIT:-30000}
      - CORTELLIS_CONTRACT_SCAN_BATCH_SIZE=${CORTELLIS_CONTRACT_SCAN_BATCH_SIZE:-5000}
      - CORTELLIS_CONTRACT_SCAN_WORKERS=${CORTELLIS_CONTRACT_SCAN_WORKERS:-8}
      - CORTELLIS_DEAL_API_SCAN_BATCH_SIZE=${CORTELLIS_DEAL_API_SCAN_BATCH_SIZE:-5000}
      - CORTELLIS_DEAL_API_SCAN_WORKERS=${CORTELLIS_DEAL_API_SCAN_WORKERS:-8}
    volumes:
      - ./data:/app/data
      - onebd_storage:/app/storage
    command: ["celery", "-A", "unified_api.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=8", "-Q", "celery,graph"]
    deploy:
      replicas: 2
    networks:
      - dokploy-network
    restart: unless-stopped

  # Celery Beat scheduler for periodic tasks
  onebd-beat:
    build:
      context: .
      dockerfile: unified_api/Dockerfile
    depends_on:
      onebd-db-cortellis:
        condition: service_healthy
      onebd-db-edgar:
        condition: service_healthy
      onebd-redis:
        condition: service_healthy
    environment:
      - CORTELLIS_DB_URL=postgresql://${CORTELLIS_USER:-cortellis}:${CORTELLIS_PASSWORD:-changeme}@onebd-db-cortellis:5432/${CORTELLIS_DB:-cortellis}
      - EDGAR_SOURCE_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - EDGAR_DB_URL=postgresql://postgres:postgres@onebd-db-edgar:5432/deals
      - NEO4J_URI=bolt://onebd-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-bdplatform123}
      - REDIS_URL=redis://onebd-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BROKER_URL=redis://onebd-redis:6379/0
      - RESULT_BACKEND=redis://onebd-redis:6379/1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Cortellis API credentials
      - CORTELLIS_API_USERNAME=${CORTELLIS_API_USERNAME}
      - CORTELLIS_API_PASSWORD=${CORTELLIS_API_PASSWORD}
      - CORTELLIS_BASE_URL=${CORTELLIS_BASE_URL:-https://api.cortellis.com/api-ws/ws/rs}
    volumes:
      - ./data:/app/data
      - onebd_storage:/app/storage
    command: ["celery", "-A", "unified_api.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    networks:
      - dokploy-network
    restart: unless-stopped

  # ============================================
  # FRONTEND
  # ============================================

  onebd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - onebd-api
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onebd-frontend.rule=Host(`onebd.machomelab.com`)"
      - "traefik.http.routers.onebd-frontend.entrypoints=web"
      - "traefik.http.services.onebd-frontend.loadbalancer.server.port=80"
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================

volumes:
  # Cortellis data volume — reuse existing Cortellis project data
  onebd_cortellis_data:
    external: true
    name: cortellis_postgres_data

  # Edgar source data volume — reuse existing Edgar project data
  onebd_edgar_data:
    external: true
    name: edgar_pgdata

  # Neo4j data
  onebd_neo4j_data:
    name: onebd-neo4j-data

  onebd_neo4j_logs:
    name: onebd-neo4j-logs

  # Redis data
  onebd_redis_data:
    name: onebd-redis-data

  # Shared storage for documents
  onebd_storage:
    name: onebd-storage

# ============================================
# NETWORKS
# ============================================

networks:
  dokploy-network:
    external: true
