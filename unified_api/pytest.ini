[pytest]
# BD Intelligence Platform - Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring databases
    unit: marks tests as unit tests
    cortellis: marks tests requiring Cortellis database connection
    edgar: marks tests requiring Edgar database connection
    neo4j: marks tests requiring Neo4j connection

# Test output
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Async support (requires pytest-asyncio)
asyncio_mode = auto

# Coverage (requires pytest-cov)
# To run with coverage: pytest --cov=unified_api --cov-report=html
