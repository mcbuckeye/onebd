version: 1
dataset_as_of: 2026-07-11
cases:
  - id: 1
    tier: regression
    rating: strong
    question: How many deals did Pfizer do in 2024?
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: How many deals did Pfizer do in 2024?
        mode: auto
    assertions:
      - type: equals
        path: data.0.deal_count
        value: 23
      - type: equals
        path: resolved_entities.0.company_id
        value: 18767
      - type: min_length
        path: citations
        value: 1
      - type: equals
        path: confidence.evidence_status
        value: grounded

  - id: 14
    tier: regression
    rating: needs_work
    question: What is the median milestone payment for Phase 3 license deals?
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: What is the median milestone payment for Phase 3 license deals?
        mode: auto
    assertions:
      - type: contains
        path: answer
        value: Milestone payment analytics are not available
      - type: equals
        path: sql_query
        value: null

  - id: 23
    tier: regression
    rating: partial
    question: Build a comp set for a Phase 2 NSCLC bispecific license.
    scope_note: Regression currently isolates modality filtering; full multi-filter truth remains pending.
    request:
      method: POST
      path: /api/comps/build
      json:
        modality: bispecific
        limit: 5
    assertions:
      - type: min_length
        path: deals
        value: 1
      - type: all_contains
        path: deals
        field: modality
        value: bispecific

  - id: 35
