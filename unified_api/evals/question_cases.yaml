version: 1
dataset_as_of: 2026-07-13
truth_queries:
  company_year_count: &company_year_count |
    SELECT COUNT(DISTINCT d.id) AS deal_count
    FROM deals d
    JOIN deal_companies dc ON dc.deal_id = d.id
    WHERE dc.company_id = 18767
      AND d.date_start >= DATE '2024-01-01'
      AND d.date_start < DATE '2025-01-01'
  current_year_top_acquirers: &current_year_top_acquirers |
    SELECT c.id, c.name, COUNT(DISTINCT d.id) AS deal_count
    FROM deals d
    JOIN deal_companies dc ON dc.deal_id = d.id AND dc.role = 'Partner'
    JOIN companies c ON c.id = dc.company_id
    WHERE d.agreement_type = 'Company - M&A (in whole or part)'
      AND d.date_start >= DATE_TRUNC('year', CURRENT_DATE)
    GROUP BY c.id, c.name
    ORDER BY deal_count DESC, c.id
    LIMIT 5
  company_deal_activity_compare: &company_deal_activity_compare |
    SELECT company.id AS company_id, company.name AS company_name,
           COUNT(DISTINCT deal.id)::int AS deal_count,
           MIN(deal.date_start) AS first_deal_date,
           MAX(deal.date_start) AS latest_deal_date,
           COUNT(DISTINCT deal.id) FILTER (
             WHERE finance.total_projected_current_amount IS NOT NULL
               AND finance.total_projected_current_currency = 'USD'
               AND finance.total_projected_current_unit = 'Million'
           )::int AS disclosed_value_count
    FROM companies company
    JOIN deal_companies company_link ON company_link.company_id = company.id
    JOIN deals deal ON deal.id = company_link.deal_id
    LEFT JOIN deal_finance_summary finance ON finance.deal_id = deal.id
    WHERE company.id IN (18767, 18077)
    GROUP BY company.id, company.name
    ORDER BY deal_count DESC, company.id
    LIMIT 20
  oncology_average: &oncology_average |
    SELECT AVG(f.total_projected_current_amount) AS average_deal_size_usd_millions,
           COUNT(*) AS disclosed_deal_count
    FROM deals d
    JOIN therapy_areas ta ON ta.id = d.therapy_area_id
    JOIN deal_finance_summary f ON f.deal_id = d.id
    WHERE ta.name = 'Cancer'
      AND f.total_projected_current_amount IS NOT NULL
      AND f.total_projected_current_currency = 'USD'
      AND f.total_projected_current_unit = 'Million'
  oncology_ma_range: &oncology_ma_range |
    SELECT MIN(f.total_projected_current_amount) AS min_value_usd_millions,
           MAX(f.total_projected_current_amount) AS max_value_usd_millions,
           AVG(f.total_projected_current_amount) AS average_value_usd_millions,
           PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY f.total_projected_current_amount) AS median_value_usd_millions,
           COUNT(*) AS disclosed_deal_count
    FROM deals d
    JOIN therapy_areas ta ON ta.id = d.therapy_area_id
    JOIN deal_finance_summary f ON f.deal_id = d.id
    WHERE ta.name = 'Cancer'
      AND d.agreement_type = 'Company - M&A (in whole or part)'
      AND d.date_start >= DATE '2020-01-01'
      AND d.date_start < DATE '2026-01-01'
      AND f.total_projected_current_amount IS NOT NULL
      AND f.total_projected_current_currency = 'USD'
      AND f.total_projected_current_unit = 'Million'
  five_year_value_trend: &five_year_value_trend |
    SELECT EXTRACT(YEAR FROM d.date_start)::int AS year,
           COUNT(*) AS deal_count,
           COUNT(f.total_projected_current_amount) AS disclosed_deal_count,
           AVG(f.total_projected_current_amount) AS average_value_usd_millions,
           SUM(f.total_projected_current_amount) AS total_value_usd_millions
    FROM deals d
    LEFT JOIN deal_finance_summary f ON f.deal_id = d.id
      AND f.total_projected_current_currency = 'USD'
      AND f.total_projected_current_unit = 'Million'
    WHERE d.date_start >= CURRENT_DATE - INTERVAL '5 years'
    GROUP BY EXTRACT(YEAR FROM d.date_start)::int
    ORDER BY year
  deal_type_split_2024: &deal_type_split_2024 |
    WITH classified AS (
      SELECT CASE
        WHEN d.agreement_type = 'Company - M&A (in whole or part)' THEN 'M&A'
        WHEN d.agreement_type ILIKE '%License%' THEN 'Licensing'
      END AS category
      FROM deals d
      WHERE d.date_start >= DATE '2024-01-01'
        AND d.date_start < DATE '2025-01-01'
    ), counts AS (
      SELECT category, COUNT(*) AS deal_count
      FROM classified
      WHERE category IS NOT NULL
      GROUP BY category
    )
    SELECT category, deal_count,
           ROUND(100.0 * deal_count / SUM(deal_count) OVER (), 2) AS percentage
    FROM counts
    ORDER BY category
  oncology_acquirers: &oncology_acquirers |
    SELECT c.id, c.name, COUNT(DISTINCT d.id) AS deal_count
    FROM deals d
    JOIN therapy_areas ta ON ta.id = d.therapy_area_id AND ta.name = 'Cancer'
    JOIN deal_companies dc ON dc.deal_id = d.id AND dc.role = 'Partner'
    JOIN companies c ON c.id = dc.company_id
    GROUP BY c.id, c.name
    ORDER BY deal_count DESC, c.id
    LIMIT 20
  largest_deals: &largest_deals |
    SELECT d.id, d.title, d.status, d.agreement_type, d.date_start,
           f.total_projected_current_amount AS total_value_usd_millions
    FROM deals d
    JOIN deal_finance_summary f ON f.deal_id = d.id
    WHERE f.total_projected_current_amount IS NOT NULL
      AND f.total_projected_current_currency = 'USD'
      AND f.total_projected_current_unit = 'Million'
    ORDER BY f.total_projected_current_amount DESC, d.id
    LIMIT 20
  largest_oncology_adc_deals: &largest_oncology_adc_deals |
    WITH eligible_deals AS (
      SELECT DISTINCT deal.id
      FROM deals deal
      JOIN therapy_areas therapy ON therapy.id = deal.therapy_area_id
      JOIN deal_technologies deal_technology
        ON deal_technology.deal_id = deal.id
      JOIN technologies technology
        ON technology.id = deal_technology.technology_id
      WHERE therapy.name = 'Cancer'
        AND (technology.name ILIKE '%antibody%drug%conjugate%'
             OR LOWER(technology.name) ~ '(^|[^a-z])adc([^a-z]|$)')
    ), coverage AS (
      SELECT COUNT(*)::int AS eligible_deal_count,
             COUNT(*) FILTER (
               WHERE finance.total_projected_current_amount IS NOT NULL
                 AND finance.total_projected_current_currency = 'USD'
                 AND finance.total_projected_current_unit = 'Million'
             )::int AS disclosed_deal_count
      FROM eligible_deals eligible
      LEFT JOIN deal_finance_summary finance ON finance.deal_id = eligible.id
    ), ranked AS (
      SELECT deal.id, deal.title, deal.status, deal.agreement_type,
             deal.date_start,
             STRING_AGG(DISTINCT technology.name, ', '
                        ORDER BY technology.name) AS adc_technologies,
             finance.total_projected_current_amount
               AS total_value_usd_millions
      FROM eligible_deals eligible
      JOIN deals deal ON deal.id = eligible.id
      JOIN deal_technologies deal_technology
        ON deal_technology.deal_id = deal.id
      JOIN technologies technology
        ON technology.id = deal_technology.technology_id
      JOIN deal_finance_summary finance ON finance.deal_id = deal.id
      WHERE (technology.name ILIKE '%antibody%drug%conjugate%'
             OR LOWER(technology.name) ~ '(^|[^a-z])adc([^a-z]|$)')
        AND finance.total_projected_current_amount IS NOT NULL
        AND finance.total_projected_current_currency = 'USD'
        AND finance.total_projected_current_unit = 'Million'
      GROUP BY deal.id, deal.title, deal.status, deal.agreement_type,
               deal.date_start, finance.total_projected_current_amount
    )
    SELECT ranked.*, coverage.eligible_deal_count,
           coverage.disclosed_deal_count
    FROM ranked CROSS JOIN coverage
    ORDER BY ranked.total_value_usd_millions DESC, ranked.id
    LIMIT 20
  therapy_area_activity: &therapy_area_activity |
    SELECT ta.name AS therapy_area, COUNT(DISTINCT d.id) AS deal_count
    FROM deals d
    JOIN therapy_areas ta ON ta.id = d.therapy_area_id
    WHERE ta.name NOT IN ('Not Applicable', 'Unknown')
    GROUP BY ta.name
    ORDER BY deal_count DESC, ta.name
    LIMIT 20
  territory_activity: &territory_activity |
    SELECT t.id AS territory_id, t.name AS territory_name,
           COUNT(DISTINCT dt.deal_id) AS deal_count
    FROM deal_territories dt
    JOIN territories t ON t.id = dt.territory_id
    GROUP BY t.id, t.name
    ORDER BY deal_count DESC, t.id
    LIMIT 20
  pfizer_dd_cortellis: &pfizer_dd_cortellis |
    WITH target_deals AS MATERIALIZED (
      SELECT DISTINCT deal.id
      FROM deal_companies company_link
      JOIN deals deal ON deal.id = company_link.deal_id
      WHERE company_link.company_id = 18767
    ), territory_scope AS (
      SELECT deal_territory.territory_id,
             deal_territory.territory_type,
             deal.id AS deal_id,
             company_link.role
      FROM deal_companies company_link
      JOIN deals deal ON deal.id = company_link.deal_id
      JOIN deal_territories deal_territory
        ON deal_territory.deal_id = deal.id
      WHERE company_link.company_id = 18767
      GROUP BY deal_territory.territory_id,
               deal_territory.territory_type,
               deal.id,
               company_link.role
    )
    SELECT (SELECT COUNT(*) FROM target_deals)::int AS total_deals,
           (SELECT COUNT(*) FROM deal_contracts contract
            JOIN target_deals target ON target.id = contract.deal_id)::int
              AS total_contracts,
           (SELECT COUNT(*) FROM territory_scope)::int
              AS total_scope_records
  pfizer_dd_edgar: &pfizer_dd_edgar |
    SELECT COUNT(*)::int AS total_filings
    FROM documents document
    JOIN raw_documents raw ON raw.id = document.raw_document_id
    WHERE raw.company_id = 524
  roche_oncology_deal_pattern: &roche_oncology_deal_pattern |
    SELECT COALESCE(d.agreement_type, 'Unknown') AS agreement_type,
           COUNT(DISTINCT d.id) AS deal_count,
           MIN(d.date_start) AS first_deal_date,
           MAX(d.date_start) AS latest_deal_date,
           COUNT(f.total_projected_current_amount) AS disclosed_value_count
    FROM deals d
    JOIN therapy_areas ta ON ta.id = d.therapy_area_id AND ta.name = 'Cancer'
    JOIN deal_companies dc ON dc.deal_id = d.id
    LEFT JOIN deal_finance_summary f ON f.deal_id = d.id
    WHERE dc.company_id = 19446
    GROUP BY COALESCE(d.agreement_type, 'Unknown')
    ORDER BY deal_count DESC, agreement_type
    LIMIT 20
  phase2_adc_upfront: &phase2_adc_upfront |
    WITH eligible_deals AS (
      SELECT DISTINCT deal.id
      FROM deals deal
      JOIN deal_technologies deal_technology ON deal_technology.deal_id = deal.id
      JOIN technologies technology ON technology.id = deal_technology.technology_id
      WHERE deal.phase_highest_start = 'Phase 2 Clinical'
        AND technology.name = 'Antibody drug conjugate'
        AND deal.agreement_type ILIKE '%License%'
    ), per_deal AS (
      SELECT term.deal_id,
             MAX(term.amount_usd_millions) AS upfront_usd_millions
      FROM deal_financial_terms term
      JOIN eligible_deals eligible ON eligible.id = term.deal_id
      WHERE term.parser_version = 4
        AND term.term_type = 'upfront_payment'
        AND term.basis = 'projected_current'
        AND term.disclosure_status = 'Known'
        AND term.amount_usd_millions IS NOT NULL
        AND NOT term.is_breakdown
      GROUP BY term.deal_id
    )
    SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY upfront_usd_millions) AS p25_upfront_usd_millions,
           PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY upfront_usd_millions) AS median_upfront_usd_millions,
           PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY upfront_usd_millions) AS p75_upfront_usd_millions,
           AVG(upfront_usd_millions) AS average_upfront_usd_millions,
           COUNT(*)::int AS disclosed_deal_count,
           (SELECT COUNT(*)::int FROM eligible_deals) AS eligible_deal_count,
           'projected_current, one maximum non-breakdown headline per deal' AS metric_definition,
           'Cortellis FinanceDetail / parser v4' AS source
    FROM per_deal
  phase3_license_milestones: &phase3_license_milestones |
    WITH eligible_deals AS (
      SELECT deal.id
      FROM deals deal
      WHERE deal.phase_highest_start = 'Phase 3 Clinical'
        AND deal.agreement_type ILIKE '%License%'
    ), per_deal AS (
      SELECT term.deal_id,
             MAX(term.amount_usd_millions) AS milestone_usd_millions
      FROM deal_financial_terms term
      JOIN eligible_deals eligible ON eligible.id = term.deal_id
      WHERE term.parser_version = 4
        AND term.term_type = 'milestone_total'
        AND term.basis = 'projected_current'
        AND term.disclosure_status = 'Known'
        AND term.amount_usd_millions IS NOT NULL
        AND NOT term.is_breakdown
      GROUP BY term.deal_id
    )
    SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY milestone_usd_millions) AS p25_milestone_usd_millions,
           PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY milestone_usd_millions) AS median_milestone_usd_millions,
           PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY milestone_usd_millions) AS p75_milestone_usd_millions,
           AVG(milestone_usd_millions) AS average_milestone_usd_millions,
           COUNT(*)::int AS disclosed_deal_count,
           (SELECT COUNT(*)::int FROM eligible_deals) AS eligible_deal_count,
           'projected_current milestone total, one maximum non-breakdown headline per deal' AS metric_definition,
           'Cortellis FinanceDetail / parser v4' AS source
    FROM per_deal
  oncology_bispecific_royalties: &oncology_bispecific_royalties |
    WITH eligible_deals AS (
      SELECT DISTINCT deal.id
      FROM deals deal
      JOIN therapy_areas therapy ON therapy.id = deal.therapy_area_id
      JOIN deal_technologies deal_technology ON deal_technology.deal_id = deal.id
      JOIN technologies technology ON technology.id = deal_technology.technology_id
      WHERE therapy.name = 'Cancer'
        AND technology.name ILIKE 'Bispecific%'
        AND deal.agreement_type ILIKE '%License%'
    ), per_deal AS (
      SELECT term.deal_id,
             MIN(COALESCE(term.rate_min_pct, term.rate_max_pct)) AS royalty_low_pct,
             MAX(COALESCE(term.rate_max_pct, term.rate_min_pct)) AS royalty_high_pct
      FROM deal_financial_terms term
      JOIN eligible_deals eligible ON eligible.id = term.deal_id
      WHERE term.parser_version = 4
        AND term.term_type = 'royalty_rate'
        AND term.basis = 'projected_current'
        AND term.disclosure_status = 'Known'
        AND (term.rate_min_pct IS NOT NULL OR term.rate_max_pct IS NOT NULL)
        AND NOT term.is_breakdown
      GROUP BY term.deal_id
    ), summarized AS (
      SELECT deal_id, royalty_low_pct, royalty_high_pct,
             (royalty_low_pct + royalty_high_pct) / 2.0 AS royalty_midpoint_pct
      FROM per_deal
    )
    SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY royalty_low_pct) AS median_royalty_low_pct,
           PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY royalty_high_pct) AS median_royalty_high_pct,
           PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY royalty_midpoint_pct) AS p25_royalty_midpoint_pct,
           PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY royalty_midpoint_pct) AS median_royalty_midpoint_pct,
           PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY royalty_midpoint_pct) AS p75_royalty_midpoint_pct,
           COUNT(*)::int AS disclosed_deal_count,
           (SELECT COUNT(*)::int FROM eligible_deals) AS eligible_deal_count,
           'projected_current, per-deal disclosed low/high range' AS metric_definition,
           'Cortellis FinanceDetail / parser v4' AS source
    FROM summarized
  upfront_over_100m: &upfront_over_100m |
    WITH per_deal AS (
      SELECT term.deal_id,
             MAX(term.amount_usd_millions) AS upfront_usd_millions,
             MAX(term.confidence) AS extraction_confidence
      FROM deal_financial_terms term
      WHERE term.parser_version = 4
        AND term.term_type = 'upfront_payment'
        AND term.basis = 'projected_current'
        AND term.disclosure_status = 'Known'
        AND term.amount_usd_millions IS NOT NULL
        AND NOT term.is_breakdown
      GROUP BY term.deal_id
    )
    SELECT deal.id AS id, deal.id AS deal_id, deal.title AS deal_title,
           deal.date_start, deal.agreement_type, deal.phase_highest_start,
           per_deal.upfront_usd_millions, per_deal.extraction_confidence,
           'projected_current, maximum non-breakdown headline per license deal' AS metric_definition,
           'Cortellis FinanceDetail / parser v4' AS source
    FROM per_deal
    JOIN deals deal ON deal.id = per_deal.deal_id
    WHERE deal.agreement_type ILIKE '%License%'
      AND per_deal.upfront_usd_millions > 100
    ORDER BY per_deal.upfront_usd_millions DESC, deal.id
    LIMIT 20
rubric_templates:
  chat_evidence: &chat_evidence
    minimum_score: 8
    checks:
      - name: substantive answer
        type: answer_quality
        weight: 2
        minimum_characters: 40
      - name: evidence matches claims
        type: evidence_alignment
        weight: 3
      - name: citations trace to returned records
        type: citation_traceability
        weight: 2
      - name: declared sample matches returned rows
        type: sample_size_consistency
        weight: 1
      - name: generated SQL is read-only
        type: sql_read_only
        weight: 2
  exact_comp_filter: &exact_comp_filter
    minimum_score: 4
    checks:
      - name: requested modality is preserved
        type: assertion
        weight: 2
        assertion:
          type: equals
          path: criteria.modality
          value: bispecific
      - name: every candidate matches modality
        type: assertion
        weight: 2
        assertion:
          type: all_contains
          path: deals
          field: modality
          value: bispecific
  exact_edgar_form_filter: &exact_edgar_form_filter
    minimum_score: 4
    checks:
      - name: results returned
        type: assertion
        weight: 2
        assertion:
          type: min_length
          path: $root
          value: 1
      - name: every result is the requested filing type
        type: assertion
        weight: 2
        assertion:
          type: all_equal
          path: $root
          field: doc_type
          value: 8-K
cases:
  - id: 1
    tier: regression
    rating: strong
    question: How many deals did Pfizer do in 2024?
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: How many deals did Pfizer do in 2024?
        mode: auto
    assertions:
      - type: equals
        path: data.0.deal_count
        value: 26
      - type: equals
        path: resolved_entities.0.company_id
        value: 18767
      - type: min_length
        path: citations
        value: 1
      - type: equals
        path: confidence.evidence_status
        value: grounded
    truth:
      source: cortellis
      query: *company_year_count
      assertions:
        - type: equals
          response_path: data.0.deal_count
          truth_path: rows.0.deal_count

  - id: 14
    tier: regression
    rating: strong
    question: What is the median milestone payment for Phase 3 license deals?
    rubric: *chat_evidence
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: What is the median milestone payment for Phase 3 license deals?
        mode: auto
    assertions:
      - type: min_length
        path: citations
        value: 1
      - type: contains
        path: sql_query
        value: deal_financial_terms
      - type: equals
        path: confidence.evidence_status
        value: grounded
    truth:
      source: cortellis
      query: *phase3_license_milestones
      assertions:
        - type: rows_equal
          response_path: data
          truth_path: rows
          fields: [p25_milestone_usd_millions, median_milestone_usd_millions, p75_milestone_usd_millions, average_milestone_usd_millions, disclosed_deal_count, eligible_deal_count, metric_definition, source]

  - id: 23
    tier: regression
    rating: partial
    question: Build a comp set for a Phase 2 NSCLC bispecific license.
    rubric: *exact_comp_filter
    scope_note: Regression currently isolates modality filtering; full multi-filter truth remains pending.
    request:
      method: POST
      path: /api/comps/build
      json:
        modality: bispecific
        limit: 5
    assertions:
      - type: min_length
        path: deals
        value: 1
      - type: all_contains
        path: deals
        field: modality
        value: bispecific

  - id: 35
    tier: regression
    rating: partial
    question: What is Roche's oncology strategy from its deal pattern?
    rubric: *chat_evidence
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: What is Roche's oncology strategy from its deal pattern?
        mode: auto
    assertions:
      - type: excludes
        path: answer
        value: Historically
    truth:
      source: cortellis
      query: *roche_oncology_deal_pattern
      assertions:
        - type: rows_equal
          response_path: data
          truth_path: rows
          fields:
            - agreement_type
            - deal_count
            - first_deal_date
            - latest_deal_date
            - disclosed_value_count

  - id: 61
    tier: regression
    rating: partial
    question: Find 8-K filings mentioning ADC partnerships.
    rubric: *exact_edgar_form_filter
    scope_note: Regression proves the 8-K form filter with a broader agreement term.
    request:
      method: GET
      path: /api/edgar/search
      params:
        query: agreement
        mode: fulltext
        doc_type: 8-K
        limit: 5
    assertions:
      - type: min_length
        path: $root
        value: 1
      - type: all_equal
        path: $root
        field: doc_type
        value: 8-K

  - id: 2
    tier: catalog
    rating: partial
    question: 'What was the biggest pharma deal ever?'
    rubric: *chat_evidence
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: 'What was the biggest pharma deal ever?'
        mode: auto
