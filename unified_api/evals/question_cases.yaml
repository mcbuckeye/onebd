          fields: [id, name, deal_count]

  - id: 4
    tier: regression
    rating: strong
    question: 'What are the largest ADC deals in oncology?'
    rubric: *chat_evidence
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: 'What are the largest ADC deals in oncology?'
        mode: auto
    assertions:
      - type: min_length
        path: data
        value: 1
      - type: contains
        path: sql_query
        value: "therapy.name = 'Cancer'"
      - type: contains
        path: sql_query
        value: "technology.name ILIKE '%antibody%drug%conjugate%'"
      - type: equals
        path: confidence.evidence_status
        value: grounded
    truth:
      source: cortellis
      query: *largest_oncology_adc_deals
      assertions:
        - type: rows_equal
          response_path: data
          truth_path: rows
          fields:
            - id
            - title
            - status
            - agreement_type
            - date_start
            - adc_technologies
            - total_value_usd_millions
            - eligible_deal_count
            - disclosed_deal_count

  - id: 5
    tier: catalog
    rating: partial
    question: 'What is BeiGene''s total deal count?'
    rubric: *chat_evidence
    request:
      method: POST
      path: /api/chat/v2
      json:
        message: 'What is BeiGene''s total deal count?'
        mode: auto
    assertions:
      - type: min_length
        path: answer
        value: 1
      - type: excludes
        path: answer
        value: encountered an error

  - id: 6
    tier: catalog
    rating: partial
    question: 'When was the last oncology M&A deal over $1B?'
    rubric: *chat_evidence
