      - type: excludes
        path: answer
        value: Historically

  - id: 61
    tier: regression
    rating: partial
    question: Find 8-K filings mentioning ADC partnerships.
    scope_note: Regression proves the 8-K form filter with a broader agreement term.
    request:
      method: GET
      path: /api/edgar/search
      params:
        query: agreement
        mode: fulltext
        doc_type: 8-K
        limit: 5
    assertions:
      - type: min_length
        path: $root
        value: 1
      - type: all_equal
        path: $root
        field: doc_type
        value: 8-K

