name: Pre-deployment quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: onebd-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            unified_api/requirements.txt
            unified_api/requirements.lock
            unified_api/requirements-test.txt
      - run: pip install -r unified_api/requirements-test.txt
      - name: Validate all 65 executable evaluation cases
        run: python -m unified_api.scripts.evaluate_questions --validate-only
      - name: Reject critical Python lint errors
        run: ruff check unified_api --select E9,F63,F7,F82
      - name: Run unit and contract tests
        run: pytest unified_api/tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
