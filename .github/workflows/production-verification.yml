name: Post-Dokploy production verification

on:
  workflow_run:
    workflows: [Pre-deployment quality gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA expected in production
        required: true

concurrency:
  # A completed pull-request quality run also emits workflow_run, even though
  # the verify job is skipped by its condition below. Give those irrelevant
  # runs unique groups so they cannot cancel the real main-push verification.
  group: >-
    onebd-production-verification-${{
      github.event_name == 'workflow_dispatch' && 'main' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && 'main' ||
       github.run_id)
    }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://onebd.pchomelab.com
      EXPECTED_SHA: ${{ inputs.commit || github.event.workflow_run.head_sha }}
    outputs:
      # Rollback is safe only after the public endpoint returned an origin
      # response. A Cloudflare/DNS/tunnel outage cannot be repaired by changing
      # application code and may also prevent the rollback webhook reaching
      # Dokploy, so leave main untouched and surface the failed verification.
      rollback_safe: ${{ steps.wait-for-deployment.outputs.rollback_safe }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for Dokploy to expose the expected image commit
        id: wait-for-deployment
        run: >-
          python -m unified_api.scripts.verify_deployment
          --base-url "$BASE_URL"
          --expected-sha "$EXPECTED_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Verify hosted MCP and OpenAPI reach the API boundary
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/mcp-boundary.json"
          status="$(curl --silent --show-error --output "$response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            "$BASE_URL/mcp")"
          case "$status" in
            200) jq -e '.result.serverInfo.name == "onebd"' "$response" >/dev/null ;;
            401) jq -e '.detail | test("API key"; "i")' "$response" >/dev/null ;;
            *)
              echo "Hosted MCP boundary returned unexpected HTTP $status"
              cat "$response"
              exit 1
              ;;
          esac
          curl --fail --silent --show-error "$BASE_URL/openapi.json" \
            | jq -e '.info.title == "BD Intelligence Platform" and (.paths["/api/v1/deals"] != null)' \
            >/dev/null
          curl --fail --silent --show-error "$BASE_URL/docs" \
            | grep -Fq 'Swagger UI'
      - run: pip install httpx==0.28.1 PyYAML==6.0.3
      - name: Run blocking production question regressions
        run: >-
          python -m unified_api.scripts.evaluate_questions
          --base-url "$BASE_URL" --tier regression
          --timeout 120 --request-retries 1
      - name: Trigger an explicitly requested rollback drill
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[rollback-drill]'; then
            echo "Controlled rollback drill requested by the deployed commit."
            exit 1
          fi

  performance:
    name: Verify production performance budgets
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://onebd.pchomelab.com
      EXPECTED_SHA: ${{ inputs.commit || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx==0.28.1
      - name: Enforce deployed search latency and source-coverage budgets
        run: >-
          python -m unified_api.scripts.benchmark_edgar_search
          --base-url "$BASE_URL" --runs 3

  rollback:
    name: Roll back a failed production deployment
    needs: verify
    if: >-
      always() &&
      needs.verify.result == 'failure' &&
      needs.verify.outputs.rollback_safe == 'true' &&
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BASE_URL: https://onebd.pchomelab.com
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      # A dedicated repository secret is required here because GitHub suppresses
      # pull_request events created by GITHUB_TOKEN. The rollback PR must emit
      # genuine PR checks for protected-main enforcement.
      GH_TOKEN: ${{ secrets.ONEBD_ROLLBACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create a revert commit from the failed main revision
        id: revert
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$FAILED_SHA" ]]; then
            echo "Main advanced from $FAILED_SHA to $current_sha; refusing to revert newer work."
            exit 1
          fi

          rollback_branch="automated-rollback-${FAILED_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch --create "$rollback_branch" origin/main
          git config user.name "onebd-production-rollback[bot]"
          git config user.email "onebd-production-rollback[bot]@users.noreply.github.com"

          parent_count="$(git rev-list --parents -n 1 "$FAILED_SHA" | awk '{print NF - 1}')"
          if [[ "$parent_count" -gt 1 ]]; then
            git revert --mainline 1 --no-edit "$FAILED_SHA"
          else
            git revert --no-edit "$FAILED_SHA"
          fi

          rollback_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$rollback_branch"
          echo "branch=$rollback_branch" >> "$GITHUB_OUTPUT"
          echo "sha=$rollback_sha" >> "$GITHUB_OUTPUT"
          echo "Created rollback $rollback_sha for failed deployment $FAILED_SHA"

      - name: Open a protected rollback pull request
        id: rollback_pr
        env:
          ROLLBACK_BRANCH: ${{ steps.revert.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr create \
            --base main \
            --head "$ROLLBACK_BRANCH" \
            --title "Automated rollback of ${FAILED_SHA:0:12}" \
            --body "Generated after production verification failed for $FAILED_SHA. This revert must pass the protected quality gate before merge.")"
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Run the protected pre-deployment gate on the rollback
        env:
          ROLLBACK_BRANCH: ${{ steps.revert.outputs.branch }}
          ROLLBACK_SHA: ${{ steps.revert.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run quality-gate.yml --ref "$ROLLBACK_BRANCH"

          required=(backend frontend compose)
          for attempt in $(seq 1 120); do
            checks="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$ROLLBACK_SHA/check-runs?per_page=100")"
            pending=0
            for name in "${required[@]}"; do
              conclusion="$(jq -r --arg name "$name" \
                '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | .conclusion // "pending"' \
                <<<"$checks")"
              echo "$name: $conclusion"
              case "$conclusion" in
                success) ;;
                pending|neutral) pending=1 ;;
                *) echo "Rollback quality gate failed in $name ($conclusion)"; exit 1 ;;
              esac
            done
            if [[ "$pending" -eq 0 ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for rollback quality checks"
          exit 1

      - name: Merge the verified rollback through protected main
        id: promote
        env:
          ROLLBACK_PR: ${{ steps.rollback_pr.outputs.number }}
          ROLLBACK_SHA: ${{ steps.revert.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$FAILED_SHA" ]]; then
            echo "Main advanced from $FAILED_SHA to $current_sha; refusing to overwrite newer work."
            exit 1
          fi
          gh pr merge "$ROLLBACK_PR" --merge --delete-branch
          git fetch origin main
          deployment_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$ROLLBACK_SHA" "$deployment_sha"; then
            echo "Merged main $deployment_sha does not contain rollback $ROLLBACK_SHA"
            exit 1
          fi
          echo "sha=$deployment_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Dokploy redeployed the rollback
        env:
          EXPECTED_SHA: ${{ steps.promote.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["BASE_URL"] + "/api/health"
          expected = os.environ["EXPECTED_SHA"]
          last = None
          for attempt in range(90):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "OneBD-Rollback-Verifier/1.0 admin@pchomelab.com",
                          "Accept": "application/json",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      last = json.load(response)
                  if last.get("status") == "healthy" and last.get("commit") == expected:
                      print(f"Dokploy is serving rollback {expected}")
                      break
              except Exception as exc:
                  last = {"error": str(exc)}
              print(f"Waiting for rollback deployment ({attempt + 1}/90): {last}")
              time.sleep(10)
          else:
              raise SystemExit(
                  f"Dokploy did not serve healthy rollback {expected}; last response={last}"
              )
          PY

      - run: pip install httpx==0.28.1 PyYAML==6.0.3
      - name: Re-run production regressions on the rollback
        run: >-
          python -m unified_api.scripts.evaluate_questions
          --base-url "$BASE_URL" --tier regression
          --timeout 120 --request-retries 1
